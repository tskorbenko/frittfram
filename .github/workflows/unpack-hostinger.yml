name: Prepare Hostinger branch

on:
  push:
    branches:
      - hostinger

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace source with static site
        run: |
          rm -rf /tmp/hostinger-static
          mkdir -p /tmp/hostinger-static
          unzip -q hostinger-static.zip -d /tmp/hostinger-static
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/hostinger-static/. .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Prepare static Hostinger deployment"
          git push
