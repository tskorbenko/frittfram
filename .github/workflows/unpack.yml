name: Unpack FrittFram source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Expand project files
        run: |
          test -f frittfram-source.zip
          unzip -o frittfram-source.zip
          rm -f frittfram-source.zip
          rm -f .github/workflows/unpack.yml
      - name: Commit project source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish FrittFram source"
          git push
